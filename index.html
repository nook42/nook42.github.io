<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="doc-title">COINU Chat-Game Tools</title>
<style>
  /* 復元クライアントと揃えたダークテーマ（#111 背景・ゴールド #d4af37） */
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(212,175,55,.10), transparent 60%),
      #0e0e0e;
    color: #e8e8e8;
    min-height: 100vh;
    margin: 0;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  a { color: #d4af37; }

  /* トップバー（言語） */
  .topBar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  select {
    background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 8px;
    color: #eee; padding: 7px 12px; font-size: 14px; outline: none; cursor: pointer;
  }
  select:focus { border-color: #d4af37; }

  /* ヘッダー */
  .brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 6px; }
  .brand .mark {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: linear-gradient(145deg, #d4af37, #9a7d1e);
    box-shadow: 0 4px 18px rgba(212,175,55,.25);
  }
  h1 { color: #d4af37; font-size: 26px; margin: 0; line-height: 1.2; letter-spacing: .2px; }
  .subtitle { color: #8a8a8a; font-size: 14px; margin: 4px 0 22px; line-height: 1.6; }

  /* メインカード */
  .card {
    background: linear-gradient(180deg, #191919, #151515);
    border: 1px solid #2e2e2e; border-radius: 14px;
    padding: 22px; margin: 0 0 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .card h2 {
    color: #d4af37; font-size: 18px; margin: 0 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before { content: '🔒'; font-size: 16px; }
  .desc { color: #9a9a9a; font-size: 13.5px; line-height: 1.7; margin: 0 0 18px; }

  /* RPC 行 */
  .rpcRow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; margin-bottom: 16px;
    background: #131313; border: 1px solid #2a2a2a; border-radius: 10px;
  }
  .rpcRow label { color: #cfcfcf; font-size: 13px; font-weight: 600; white-space: nowrap; }
  #rpc-select { flex: 1; min-width: 200px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  /* ボタン（検証して起動） */
  button {
    background: linear-gradient(180deg, #e2c04a, #cb9f2c);
    color: #1a1400; border: 0; padding: 13px 18px; border-radius: 10px;
    cursor: pointer; font-size: 15px; font-weight: 700; width: 100%;
    box-shadow: 0 4px 16px rgba(212,175,55,.22); transition: transform .05s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }

  /* 進捗 */
  #stage { color: #7fd97f; font-size: 12.5px; margin-top: 12px; min-height: 1em; font-variant-numeric: tabular-nums; }

  /* 結果カード（app.js が result ok/warn/fail を付与） */
  .result {
    padding: 12px 14px 12px 42px; border-radius: 10px; margin: 12px 0 0;
    font-size: 13.5px; line-height: 1.6; position: relative;
    border: 1px solid transparent;
  }
  .result::before { position: absolute; left: 14px; top: 12px; font-size: 15px; }
  .result.ok   { background: rgba(76,175,80,.10);  border-color: rgba(76,175,80,.4);  color: #b7e6b8; }
  .result.ok::before   { content: '✓'; color: #4caf50; }
  .result.warn { background: rgba(212,175,55,.10); border-color: rgba(212,175,55,.45); color: #e6d49a; }
  .result.warn::before { content: '⚠'; color: #d4af37; }
  .result.fail { background: rgba(244,67,54,.10);  border-color: rgba(244,67,54,.45); color: #f0b3ad; }
  .result.fail::before { content: '✕'; color: #f44336; }

  /* 起動後の動的要素 */
  #launch-area { margin-top: 14px; }
  #launch-area button { margin-top: 0; }
  .togo {
    display: inline-block; margin-top: 6px; padding: 11px 18px;
    background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 10px;
    color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;
  }
  .togo:hover { border-color: #d4af37; background: #222; }

  /* 保証文（脅威モデルの但し書き） */
  .guarantee {
    color: #7a7a7a; font-size: 12px; line-height: 1.7; margin: 0 0 20px;
    padding: 12px 14px; background: #121212; border-left: 3px solid #3a3a3a; border-radius: 6px;
  }

  /* 復元クライアントへの導線 */
  .footerLink { text-align: center; }
  .footerLink a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
    color: #b9b9b9; text-decoration: none; padding: 8px 12px; border-radius: 8px;
  }
  .footerLink a::before { content: '↩'; color: #d4af37; }
  .footerLink a:hover { color: #d4af37; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topBar"><select id="lang-select"></select></div>
    <div class="brand">
      <div class="mark">₿</div>
      <h1 id="title">COINU Chat-Game Tools</h1>
    </div>
    <p id="subtitle" class="subtitle"></p>

    <div class="card">
      <h2 id="h-loader"></h2>
      <p id="desc-loader" class="desc"></p>
      <div class="rpcRow">
        <label id="rpc-label"></label>
        <select id="rpc-select"></select>
      </div>
      <button id="verify-btn"></button>
      <div id="stage"></div>
      <div id="result"></div>
      <div id="launch-area"></div>
    </div>

    <p class="guarantee" id="guarantee"></p>
    <p class="footerLink"><a href="./recovery.html" id="recovery-link"></a></p>
  </div>
  <script src="./loader.bundle.js"></script>
</body>
</html>
