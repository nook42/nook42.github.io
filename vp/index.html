<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>viewport check</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  /* 高さの単位ごとの帯（画面の上端から、その高さまで） */
  .bar { position: fixed; top: 0; width: 14px; z-index: 5; }
  #b-svh { left: 0;  height: 100svh; background: #e33; }
  #b-lvh { left: 16px; height: 100lvh; background: #39f; }
  #b-dvh { left: 32px; height: 100dvh; background: #3c6; }
  #b-vh  { left: 48px; height: 100vh;  background: #fc3; }
  .tick { position: fixed; left: 0; right: 0; height: 0; border-top: 2px dashed; z-index: 4; }
  #t-svh { top: 100svh; border-color: #e33; transform: translateY(-2px); }
  #t-lvh { top: 100lvh; border-color: #39f; transform: translateY(-2px); }
  #t-dvh { top: 100dvh; border-color: #3c6; transform: translateY(-2px); }
  /* 測るための見えない箱 */
  .probe { position: absolute; top: 0; left: -9999px; width: 1px; visibility: hidden; }
  #p-svh { height: 100svh; } #p-lvh { height: 100lvh; } #p-dvh { height: 100dvh; } #p-vh { height: 100vh; }
  #p-safe { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); height: 0; }
  #panel { position: fixed; top: 0; left: 70px; right: 6px; z-index: 6; background: rgba(0,0,0,.78); padding: 8px 10px; border-radius: 0 0 8px 8px; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 1px 4px; white-space: nowrap; }
  #panel td.v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; }
  #panel td.r { color: #bbb; font-size: 13px; padding-left: 10px; }
  .k-svh { color: #f66; } .k-lvh { color: #6af; } .k-dvh { color: #6d8; } .k-vh { color: #fd5; }
  #ua { font-size: 11px; color: #aaa; white-space: normal; word-break: break-all; margin-top: 4px; }
  main { padding: 0 12px 0 70px; }
  .spacer { height: 400vh; background: repeating-linear-gradient(#111 0 120px, #1c1c1c 120px 240px); }
  .row { height: 120px; display: flex; align-items: center; color: #888; }
</style>
</head>
<body>
<div class="bar" id="b-svh"></div><div class="bar" id="b-lvh"></div><div class="bar" id="b-dvh"></div><div class="bar" id="b-vh"></div>
<div class="tick" id="t-svh"></div><div class="tick" id="t-lvh"></div><div class="tick" id="t-dvh"></div>
<div class="probe" id="p-svh"></div><div class="probe" id="p-lvh"></div><div class="probe" id="p-dvh"></div><div class="probe" id="p-vh"></div><div class="probe" id="p-safe"></div>
<div id="panel">
  <table>
    <tr><td class="k-svh">100svh</td><td class="v" id="svh"></td><td class="r" id="svh-r"></td></tr>
    <tr><td class="k-lvh">100lvh</td><td class="v" id="lvh"></td><td class="r" id="lvh-r"></td></tr>
    <tr><td class="k-dvh">100dvh</td><td class="v" id="dvh"></td><td class="r" id="dvh-r"></td></tr>
    <tr><td class="k-vh">100vh</td><td class="v" id="vh"></td><td class="r" id="vh-r"></td></tr>
    <tr><td>innerH</td><td class="v" id="ih"></td><td class="r" id="ih-r"></td></tr>
    <tr><td>visualVP</td><td class="v" id="vv"></td><td class="r" id="vv-r"></td></tr>
    <tr><td>clientH</td><td class="v" id="ch"></td><td class="r">screen <b id="sc"></b> dpr <b id="dpr"></b></td></tr>
    <tr><td>lvh−svh</td><td class="v" id="bar"></td><td class="r">safe 上 <b id="st"></b> 下 <b id="sb"></b></td></tr>
    <tr><td>scrollY</td><td class="v" id="sy"></td><td class="r">vvTop <b id="vvt"></b> 幅 <b id="iw"></b></td></tr>
  </table>
  <div id="ua"></div>
</div>
<main>
  <div class="spacer">
    <div class="row">下へスクロールして、下の帯が畳まれた状態でも写してください</div>
  </div>
</main>
<script>
  // 画面の高さの単位と、ウィンドウの高さを表示するだけ。どこにも送らず、何も保存しない。
  var seen = {};
  function h(id) { return Math.round(document.getElementById(id).getBoundingClientRect().height); }
  function put(id, v) { document.getElementById(id).textContent = v; }
  function track(id, v) {
    put(id, v);
    var s = seen[id] || (seen[id] = { min: v, max: v });
    if (v < s.min) s.min = v; if (v > s.max) s.max = v;
    put(id + '-r', '(' + s.min + '〜' + s.max + ')');
  }
  function update() {
    track('svh', h('p-svh')); track('lvh', h('p-lvh')); track('dvh', h('p-dvh')); track('vh', h('p-vh'));
    track('ih', window.innerHeight);
    var vv = window.visualViewport;
    track('vv', vv ? Math.round(vv.height) : -1);
    put('vvt', vv ? Math.round(vv.offsetTop) : '-');
    put('ch', document.documentElement.clientHeight);
    put('sc', screen.width + 'x' + screen.height);
    put('dpr', window.devicePixelRatio);
    put('bar', h('p-lvh') - h('p-svh'));
    var cs = getComputedStyle(document.getElementById('p-safe'));
    put('st', parseFloat(cs.paddingTop)); put('sb', parseFloat(cs.paddingBottom));
    put('sy', Math.round(window.scrollY)); put('iw', window.innerWidth);
  }
  document.getElementById('ua').textContent = navigator.userAgent;
  var queued = false;
  function soon() { if (!queued) { queued = true; requestAnimationFrame(function () { queued = false; update(); }); } }
  window.addEventListener('scroll', soon, { passive: true });
  window.addEventListener('resize', soon);
  if (window.visualViewport) { visualViewport.addEventListener('resize', soon); visualViewport.addEventListener('scroll', soon); }
  setInterval(update, 500);
  update();
</script>
</body>
</html>
